### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
image_max_pixels: 2100000
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false
deepspeed: ./examples/deepspeed/ds_z3_config.json

### dataset
dataset: agentnet_windowed_shard00000,agentnet_windowed_shard00001,agentnet_windowed_shard00002,agentnet_windowed_shard00003,agentnet_windowed_shard00004
template: qwen2_vl
cutoff_len: 16384
streaming: false
overwrite_cache: false
preprocessing_num_workers: 32
dataloader_num_workers: 16
mask_history: true
dataset_dir: ./data

image_token_removal_enabled: true

### output
output_dir: ./output/Qwen2.5-7B-ReVision
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: qwen_25_7B_revision

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null